{% extends 'layouts/base.html' %}

{% block title %}Modifier une critique{% endblock %}

{% block content %}
    <h2>Modifier ma critique</h2>

    <form action="{% url 'reservations:review_edit' review.id %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="_method" value="PUT">
        <table>{{ form.as_table }}</table>
        <button>Modifier</button>
        <a href="{% url 'reservations:show_review' review.id %}">Annuler</a>
    </form>

    <nav><a href="{% url 'reservations:review_index' %}">Retour à l'index</a></nav>
{% endblock %}
