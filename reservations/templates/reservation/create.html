{% extends 'layouts/base.html' %}

{% block title %}Réserver{% endblock %}

{% block content %}
    <h2>Réserver</h2>

    <form action="{% url 'reservations:reservation_create' %}" method="post">
        {% csrf_token %}
        <table border="1" cellspacing="0">{{ form.as_table }}</table>
        <button>Réserver</button>
        <a href="{% url 'reservations:reservation_index' %}">Annuler</a>
    </form>

    <nav><a href="{% url 'reservations:reservation_index' %}">Retour à l'index</a></nav>
{% endblock %}
