{% extends 'layouts/base.html' %}

{% block title %}Ajouter un artiste{% endblock %}

{% block content %}
    <h2>Ajouter un artiste</h2>

    <form action="{% url 'reservations:artist_create' %}" method="post">
        {% csrf_token %}

        <table>{{ form.as_table }}</table>

        <button>Ajouter</button>
        <a href="{% url 'reservations:artist_index' %}">Annuler</a>
    </form>

    <nav><a href="{% url 'reservations:artist_index' %}">Retour à l'index</a></nav>
{% endblock %}
