{% extends 'layouts/base.html' %}

{% block title %}Ajouter un spectacle{% endblock %}

{% block content %}
    <h2>Ajouter un spectacle</h2>

    <form action="{% url 'reservations:show_create' %}" method="post">
        {% csrf_token %}
        <table border="1" cellspacing="0">{{ form.as_table }}</table>
        <button>Ajouter</button>
        <a href="{% url 'reservations:show_index' %}">Annuler</a>
    </form>

    <nav><a href="{% url 'reservations:show_index' %}">Retour à l'index</a></nav>
{% endblock %}
