{% extends 'layouts/base.html' %}

{% block title %}Modifier un spectacle{% endblock %}

{% block content %}
    <h2>Modifier un spectacle</h2>

    <form action="{% url 'reservations:show_edit' show.id %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="_method" value="PUT">
        {{ form }}
        <button>Modifier</button>
        <a href="{% url 'reservations:show_show' show.id %}">Annuler</a>
    </form>

    <nav><a href="{% url 'reservations:show_index' %}">Retour à l'index</a></nav>
{% endblock %}
