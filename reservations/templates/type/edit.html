{% extends 'layouts/base.html' %}

{% block title %}Modifier un type{% endblock %}

{% block content %}
    <h2>Modifier un type</h2>

    <form action="{% url 'reservations:type_edit' type.id %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="_method" value="PUT">
        {{ form }}
        <button>Modifier</button>
        <a href="{% url 'reservations:show_type' type.id %}">Annuler</a>
    </form>

    <nav><a href="{% url 'reservations:type_index' %}">Retour à l'index</a></nav>
{% endblock %}
