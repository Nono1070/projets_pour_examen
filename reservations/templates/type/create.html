{% extends 'layouts/base.html' %}

{% block title %}Ajouter un type{% endblock %}

{% block content %}
    <h2>Ajouter un type</h2>

    <form action="{% url 'reservations:type_create' %}" method="post">
        {% csrf_token %}
        {{ form }}
        <button>Ajouter</button>
        <a href="{% url 'reservations:type_index' %}">Annuler</a>
    </form>

    <nav><a href="{% url 'reservations:type_index' %}">Retour à l'index</a></nav>
{% endblock %}
