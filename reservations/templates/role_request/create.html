{% extends 'layouts/base.html' %}

{% block title %}Devenir {{ role_label }}{% endblock %}

{% block content %}
    <h2>Demande : {{ role_label }}</h2>

    <form method="post">
        {% csrf_token %}
        <table border="1" cellspacing="0">
            <tr>
                <th>Message (optionnel)</th>
                <td><textarea name="message" rows="4" cols="40"></textarea></td>
            </tr>
        </table>
        <button type="submit">Envoyer la demande</button>
        <a href="{% url 'accounts:user-profile' %}">Annuler</a>
    </form>
{% endblock %}
