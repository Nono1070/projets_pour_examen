{% extends 'layouts/base.html' %}

{% block title %}Ajouter un lieu{% endblock %}

{% block content %}
    <h2>Ajouter un lieu</h2>

    <form action="{% url 'reservations:location_create' %}" method="post">
        {% csrf_token %}
        <table>{{ form.as_table }}</table>
        <button>Ajouter</button>
        <a href="{% url 'reservations:location_index' %}">Annuler</a>
    </form>

    <nav><a href="{% url 'reservations:location_index' %}">Retour à l'index</a></nav>
{% endblock %}
