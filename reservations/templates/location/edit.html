{% extends 'layouts/base.html' %}

{% block title %}Modifier un lieu{% endblock %}

{% block content %}
    <h2>Modifier un lieu</h2>

    <form action="{% url 'reservations:location_edit' location.id %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="_method" value="PUT">
        {{ form }}
        <button>Modifier</button>
        <a href="{% url 'reservations:show_location' location.id %}">Annuler</a>
    </form>

    <nav><a href="{% url 'reservations:location_index' %}">Retour à l'index</a></nav>
{% endblock %}
