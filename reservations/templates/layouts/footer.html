{% if not request.COOKIES.cookie_consent %}
<table border="1" cellpadding="4" width="100%">
    <tr>
        <td>
            Ce site utilise des cookies nécessaires à son fonctionnement (session, préférences).
            <form method="post" action="{% url 'reservations:accept_cookies' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.path }}">
                <button type="submit">Accepter</button>
            </form>
        </td>
    </tr>
</table>
{% endif %}
